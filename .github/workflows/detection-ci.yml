name: Detection-as-Code CI
on:
  push:
  pull_request:
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate rule structure
        run: python scripts/validate_rules.py
      - name: Check synthetic true/false-positive cases
        run: python scripts/check_fixtures.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
